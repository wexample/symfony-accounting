      - name: ledger
        type: Wexample\SymfonyAccounting\Entity\Ledger
      - name: id
        type: Symfony\Component\Uid\Uuid
      - name: journal
        type: Journal
      - name: fiscalYear
        type: FiscalYear
      - name: number
        type: int
        nullable: true
        default: null
      - name: date
        type: DateTimeImmutable
      - name: label
        type: string
      - name: pieceReference
        type: string
        nullable: true
        default: null
      - name: pieceDate
        type: DateTimeImmutable
        nullable: true
        default: null
      - name: sourceType
        type: string
        nullable: true
        default: null
      - name: sourceId
        type: string
        nullable: true
        default: null
      - name: status
        type: EntryStatus
        default: null
      - name: dateValidated
        type: DateTimeImmutable
        nullable: true
        default: null
      - name: dateCreated
        type: DateTimeImmutable
      - name: lines
        type: Collection
        description: EntryLine>
