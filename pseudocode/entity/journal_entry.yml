items:
  - name: JournalEntry
    type: class
    description: "One balanced accounting entry (FEC \"écriture\"): lines whose debits equal credits.\nIt is numbered when posted, without gaps within its fiscal year. `sourceType`\nand `sourceId` say what produced it (an invoice, an allocation, a closing), so\nthat a document is never booked twice."
