framework:
  default_locale: en
  session:
    storage_factory_id: session.storage.factory.mock_file

# Signed in through the test client (loginUser), for the API.
security:
  providers:
    memory:
      memory:
        # The firm members of LedgerAccessTest and ApiTest; grants come from their groups.
        users:
          root: { roles: [ROLE_ADMIN] }
          anna: { roles: [ROLE_USER] }
          chris: { roles: [ROLE_USER] }
  firewalls:
    main:
      lazy: true
      provider: memory

services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: true

  Wexample\SymfonyRemotePayment\Class\FakePaymentProvider:
    arguments:
      $name: fake
      $methods: [card]

  Wexample\SymfonyRemotePeppol\Class\FakeAccessPoint:
    arguments:
      $name: fake

  Wexample\SymfonyMoney\Service\MoneyFormatter:
    arguments:
      $defaultLocale: en

  # A payable of a package accounting never heard of, and VIES without the network.
  Wexample\SymfonyAccounting\Tests\Fixtures\App\Payable\TestSaleResolver: ~

  Wexample\SymfonyRemoteVies\Service\ViesClient:
    arguments:
      $httpClient: !service { class: Wexample\SymfonyAccounting\Tests\Fixtures\App\Vies\FakeVies }
      $cache: null

  # Ledgers tied to groups, grants held on them: memberships, as an application has them.
  Wexample\SymfonyAccounting\Tests\Fixtures\App\Access\FirmGroupResolver: ~
  Wexample\SymfonyAccounting\Tests\Fixtures\App\Access\FirmGrantVoter: ~

wexample_symfony_accounting:
  sales_ledger: shop
  access:
    grants: { view: client, edit: accountant, administer: partner }

doctrine:
  orm:
    mappings:
      Fixtures:
        type: attribute
        is_bundle: false
        dir: '%kernel.project_dir%/Entity'
        prefix: 'Wexample\SymfonyAccounting\Tests\Fixtures\App\Entity'
    resolve_target_entities:
      Wexample\SymfonyHelpers\Entity\Interfaces\UserEntityInterface: Wexample\SymfonyAccounting\Tests\Fixtures\App\Entity\TestAccount
